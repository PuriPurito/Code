<style>
	:root {
		--avans-blue: rgba(16, 52, 158, 1);
		--avans-black: rgba(4, 24, 57, 1);
		--avans-black-disable: rgba(170, 176, 188, 1);
		--avans-gray: rgba(54, 70, 97, 1);
		--avans-input-bg: rgba(242, 243, 245, 1);
		--avans-radius-normal: 8px;
		--avans-radius-big: 12px;
		--avans-font-bold: 500 15px/22px Golos-Text, Arial, sans-serif;
		--avans-font-normal: 400 15px/22px Golos-Text, Arial, sans-serif;
		--avans-font-small: 400 13px/18px Golos-Text, Arial, sans-serif;
		--avans-error-color: rgba(168, 7, 39, 1);
	}

	.avans-container {
		max-width: 960px;
		margin: 0 auto;
	}

	.avans-hidden {
		display: none;
	}

	.avans-loading,
	.avans-denied {
		font: var(--avans-font-normal);
		color: var(--avans-gray);
		padding: 24px 0;
	}

	.avans-denied {
		color: var(--avans-error-color);
	}

	.avans-section-title {
		font: var(--avans-font-bold);
		color: var(--avans-black);
		margin: 24px 0 12px;
	}

	.avans-section-title:first-child {
		margin-top: 0;
	}

	.avans-error-text {
		color: var(--avans-error-color);
		font: var(--avans-font-small);
		display: none;
		margin: 8px 0 0;
	}

	.avans-error-text.avans-error-text_shown {
		display: block;
	}

	.avans-footer {
		margin: 24px 0 0;
		display: flex;
		gap: 12px;
		justify-content: flex-end;
	}

	.avans-save,
	.avans-submit {
		font: var(--avans-font-bold);
		border: none;
		padding: 14px 30px;
		border-radius: var(--avans-radius-normal);
		cursor: pointer;
		transition: opacity 0.3s;
	}

	.avans-save {
		background-color: var(--avans-input-bg);
		color: var(--avans-blue);
	}

	.avans-submit {
		background-color: #10349e;
		color: #fff;
	}

	.avans-save:hover,
	.avans-submit:hover {
		opacity: 0.7;
	}

	.avans-save:disabled,
	.avans-submit:disabled {
		background-color: var(--avans-input-bg);
		color: var(--avans-black-disable);
		cursor: not-allowed;
		opacity: 1;
	}

	.report-table-wrap {
		overflow-x: auto;
		border-radius: var(--avans-radius-big);
		border: 1px solid rgba(3, 17, 82, 0.08);
	}

	.report-table {
		width: 100%;
		table-layout: fixed;
		border-collapse: collapse;
		font: var(--avans-font-small);
	}

	.report-table th {
		text-align: left;
		color: var(--avans-gray);
		font-weight: 500;
		padding: 10px 6px;
		background-color: var(--avans-input-bg);
	}

	.report-table td {
		padding: 6px 6px;
		border-top: 1px solid #ecedf0;
		vertical-align: middle;
	}

	.report-table tr.report-row_locked td {
		background-color: #fbfbfc;
	}

	.report-cell-text {
		font: var(--avans-font-small);
		color: var(--avans-black);
		word-break: break-word;
	}

	.report-cell-text_sum {
		display: block;
		text-align: center;
	}

	.report-input,
	.report-select {
		font: var(--avans-font-small);
		color: var(--avans-black);
		border: 1px solid var(--avans-input-bg);
		background-color: var(--avans-input-bg);
		border-radius: 6px;
		padding: 6px 8px;
		width: 100%;
		box-sizing: border-box;
	}

	.report-input:focus,
	.report-select:focus {
		outline: none;
		background-color: #fff;
		border-color: #1d4cc4;
	}

	.report-input:disabled,
	.report-select:disabled {
		background-color: transparent;
		border-color: transparent;
		color: var(--avans-black);
		padding-left: 0;
	}

	.report-input_sum {
		text-align: right;
	}

	.report-input_compact {
		font-size: 13px !important;
		line-height: 17px !important;
	}

	.report-file-link {
		color: var(--avans-blue);
		cursor: pointer;
		text-decoration: none;
	}

	.report-file-link:hover {
		text-decoration: underline;
	}

	.report-remove-btn {
		border: none;
		background: transparent;
		color: var(--avans-error-color);
		cursor: pointer;
		font: var(--avans-font-small);
		padding: 4px 2px;
		white-space: nowrap;
	}

	.report-remove-btn:hover {
		opacity: 0.7;
	}

	.report-add-row {
		padding: 10px 8px;
	}

	.report-add-btn {
		border: 1px dashed rgba(3, 17, 82, 0.2);
		background: transparent;
		color: var(--avans-blue);
		font: var(--avans-font-small);
		border-radius: 6px;
		padding: 8px 14px;
		cursor: pointer;
	}

	.report-add-btn:hover {
		opacity: 0.7;
	}

	.report-empty {
		font: var(--avans-font-small);
		color: var(--avans-gray);
		padding: 16px 8px;
	}

	.report-files-btn {
		border: 1px solid var(--avans-input-bg);
		background-color: var(--avans-input-bg);
		color: var(--avans-blue);
		font: var(--avans-font-small);
		border-radius: 6px;
		padding: 6px 10px;
		cursor: pointer;
		white-space: nowrap;
	}

	.report-files-btn:hover {
		opacity: 0.7;
	}

	.report-files-dash {
		font: var(--avans-font-small);
		color: var(--avans-black-disable);
	}

	.avans-modal {
		position: fixed;
		inset: 0;
		z-index: 1000;
		display: flex;
		align-items: center;
		justify-content: center;
		padding: 20px;
	}

	.avans-modal.avans-hidden {
		display: none;
	}

	.avans-modal-backdrop {
		position: absolute;
		inset: 0;
		background: rgba(4, 24, 57, 0.45);
	}

	.avans-modal-box {
		position: relative;
		background: #fff;
		border-radius: var(--avans-radius-big);
		width: 100%;
		max-width: 520px;
		max-height: 80vh;
		display: flex;
		flex-direction: column;
		box-shadow: 0 12px 40px rgba(4, 24, 57, 0.25);
	}

	.avans-modal-header {
		display: flex;
		align-items: center;
		justify-content: space-between;
		padding: 16px 20px;
		border-bottom: 1px solid #ecedf0;
	}

	.avans-modal-title {
		font: var(--avans-font-bold);
		color: var(--avans-black);
	}

	.avans-modal .avans-modal-close,
	.avans-modal .avans-modal-close:hover,
	.avans-modal .avans-modal-close:focus,
	.avans-modal .avans-modal-close:active {
		border: none;
		background: transparent;
		outline: none;
		box-shadow: none;
		text-decoration: none;
		font-size: 16px;
		line-height: 1;
		cursor: pointer;
		padding: 4px;
	}

	.avans-modal .avans-modal-close {
		color: var(--avans-gray);
	}

	.avans-modal .avans-modal-close:hover {
		color: var(--avans-error-color);
	}

	.avans-modal-body {
		padding: 16px 20px;
		overflow-y: auto;
	}

	.avans-modal-footer {
		padding: 12px 20px 16px;
		display: flex;
		justify-content: flex-end;
	}

	.avans-files {
		list-style: none;
		margin: 0 0 12px;
		padding: 0;
	}

	.avans-files-empty {
		font: var(--avans-font-small);
		color: var(--avans-gray);
		margin: 0 0 12px;
	}

	.avans-files-item {
		display: flex;
		align-items: center;
		gap: 10px;
		padding: 8px 0;
		border-top: 1px solid #ecedf0;
	}

	.avans-files-item:first-child {
		border-top: none;
	}

	.avans-files-name {
		flex: 1 1 auto;
		min-width: 0;
		font: var(--avans-font-small);
		color: var(--avans-black);
		word-break: break-word;
	}

	.avans-files-name.report-file-link {
		color: var(--avans-blue);
	}

	.avans-files-pending {
		color: var(--avans-black-disable);
		font: var(--avans-font-small);
		flex-shrink: 0;
	}

	.avans-files-action {
		border: none;
		background: transparent;
		cursor: pointer;
		font: var(--avans-font-small);
		flex-shrink: 0;
		padding: 4px 2px;
	}

	.avans-files-action_remove {
		color: var(--avans-error-color);
	}

	.avans-files-action:hover {
		opacity: 0.7;
	}

	.avans-files-add {
		display: inline-flex;
		align-items: center;
		gap: 6px;
		font: var(--avans-font-small);
		color: var(--avans-blue);
		cursor: pointer;
	}

	.avans-files-add.avans-hidden {
		display: none;
	}

	.avans-files-add input[type="file"] {
		display: none;
	}
</style>

<div class="avans-container" id="report-container">
	<div class="avans-loading" id="report-loading">Загрузка данных авансового отчёта...</div>

	<div id="report-form" class="avans-hidden">
		<div class="avans-section-title">Расходы</div>
		<div class="report-table-wrap">
			<table class="report-table">
				<thead>
					<tr>
						<th style="width: 14%">Категория расходов</th>
						<!-- <th style="width: 16%">Поставщик</th> -->
						<th style="width: 15%">Наименование документа</th>
						<th style="width: 9%">Номер документа</th>
						<th style="width: 13%">Дата документа</th>
						<th style="width: 9%">Сумма</th>
						<th style="width: 8%">Валюта</th>
						<th style="width: 9%">Файлы</th>
						<th style="width: 7%"></th>
					</tr>
				</thead>
				<tbody id="report-expenses-body"></tbody>
			</table>
		</div>
		<div class="report-add-row">
			<button type="button" class="report-add-btn" id="report-add-expense">+ Добавить строку расходов</button>
		</div>

		<div class="avans-section-title">Билеты</div>
		<div class="report-table-wrap">
			<table class="report-table">
				<thead>
					<tr>
						<th style="width: 67%">Вид входящего документа</th>
						<th style="width: 9%">Сумма</th>
						<th style="width: 8%">Валюта</th>
						<th style="width: 9%">Файлы</th>
						<th style="width: 7%"></th>
					</tr>
				</thead>
				<tbody id="report-tickets-body"></tbody>
			</table>
		</div>

		<div class="avans-error-text" id="report-error"></div>

		<div class="avans-footer">
			<button type="button" class="avans-save" id="report-save">Сохранить</button>
			<button type="button" class="avans-submit" id="report-submit">Отправить</button>
		</div>
	</div>

	<div class="avans-denied avans-hidden" id="report-denied"></div>

	<div class="avans-modal avans-hidden" id="report-files-modal">
		<div class="avans-modal-backdrop" id="report-files-modal-backdrop"></div>
		<div class="avans-modal-box" role="dialog" aria-modal="true">
			<div class="avans-modal-header">
				<span class="avans-modal-title">Файлы</span>
				<button type="button" class="avans-modal-close" id="report-files-modal-close" title="Закрыть">✕</button>
			</div>
			<div class="avans-modal-body">
				<ul class="avans-files" id="report-files-list"></ul>
				<p class="avans-files-empty" id="report-files-empty" hidden>Файлы не прикреплены</p>
				<label class="avans-files-add" id="report-files-add">
					<input type="file" multiple id="report-files-add-input" />
					<span>+ Загрузить файлы</span>
				</label>
			</div>
			<div class="avans-modal-footer">
				<button type="button" class="avans-save" id="report-files-modal-done">Готово</button>
			</div>
		</div>
	</div>
</div>

<script>
	(function () {
		var iBusinessTripID = "<%= OptInt(curObjectID) %>";

		var container = document.querySelector("#report-container");
		var loadingEl = container.querySelector("#report-loading");
		var formEl = container.querySelector("#report-form");
		var deniedEl = container.querySelector("#report-denied");
		var errorEl = container.querySelector("#report-error");

		var expensesBody = container.querySelector("#report-expenses-body");
		var ticketsBody = container.querySelector("#report-tickets-body");
		var addExpenseBtn = container.querySelector("#report-add-expense");
		var saveBtn = container.querySelector("#report-save");
		var submitBtn = container.querySelector("#report-submit");

		var filesModalEl = container.querySelector("#report-files-modal");
		var filesModalListEl = container.querySelector("#report-files-list");
		var filesModalEmptyEl = container.querySelector("#report-files-empty");
		var filesModalAddEl = container.querySelector("#report-files-add");
		var filesModalAddInputEl = container.querySelector("#report-files-add-input");

		var DAILY_GROUP = "Суточные";
		var newRowCounter = 0;

		var state = {
			isSent: false,
			categories: [],
			currencies: [],
			incomingDocTypes: [],
			expenses: [],
			tickets: []
		};

		var ExpenseReportApi = (function () {
			var OBJECT_CODE = "afl_business_trip_handler";
			var BASE_URL = "/custom_web_template.html";

			function request(params, method) {
				var sMethod = method || "GET";
				var oParams = Object.assign({ business_trip_id: iBusinessTripID }, params || {});
				var sUrl = BASE_URL + "?object_code=" + encodeURIComponent(OBJECT_CODE);
				var oFetchOptions = { method: sMethod };

				if (sMethod === "GET") {
					var qGet = new URLSearchParams();
					Object.keys(oParams).forEach(function (key) {
						var value = oParams[key];
						if (value !== undefined && value !== null) qGet.set(key, value);
					});
					sUrl += "&" + qGet.toString();
				} else {
					var qBody = new URLSearchParams();
					Object.keys(oParams).forEach(function (key) {
						var value = oParams[key];
						if (value !== undefined && value !== null) qBody.set(key, value);
					});
					oFetchOptions.headers = { "Content-Type": "application/x-www-form-urlencoded" };
					oFetchOptions.body = qBody.toString();
				}

				return fetch(sUrl, oFetchOptions).then(function (resp) {
					return resp
						.json()
						.catch(function () {
							throw new Error("Некорректный ответ сервера (не JSON)");
						})
						.then(function (body) {
							if (!body || body.success !== true) {
								throw new Error((body && body.message) || "Ошибка запроса (HTTP " + resp.status + ")");
							}
							return body;
						});
				});
			}

			return {
				getData: function () {
					return request({ action: "get_report_data" }, "GET").then(function (body) {
						return body.data;
					});
				},
				saveDraft: function (params) {
					return request(Object.assign({ action: "save_report_draft" }, params || {}), "POST").then(function (body) {
						return body.data;
					});
				},
				send: function (params) {
					return request(Object.assign({ action: "send_report" }, params || {}), "POST").then(function (body) {
						return body.data;
					});
				}
			};
		})();

		function stampOrigFiles(oRow) {
			oRow.files = (oRow.files || []).map(function (oFile) {
				return { id: oFile.id, name: oFile.name };
			});
			oRow.origFileIds = oRow.files.map(function (oFile) {
				return String(oFile.id);
			});
			return oRow;
		}

		function clearError() {
			errorEl.textContent = "";
			errorEl.classList.remove("avans-error-text_shown");
		}

		function showError(sMessage) {
			errorEl.textContent = sMessage;
			errorEl.classList.add("avans-error-text_shown");
		}

		function isCategoryDaily(iCategoryId) {
			var oCat = state.categories.filter(function (c) {
				return c.id === iCategoryId;
			})[0];
			return !!(oCat && oCat.group === DAILY_GROUP);
		}

		function fillSelectOptions(selectEl, aOptions, sSelectedValue, sPlaceholder) {
			selectEl.innerHTML = "";
			if (sPlaceholder) {
				var elPlaceholder = document.createElement("option");
				elPlaceholder.value = "";
				elPlaceholder.textContent = sPlaceholder;
				selectEl.appendChild(elPlaceholder);
			}
			aOptions.forEach(function (oOption) {
				var elOption = document.createElement("option");
				elOption.value = oOption.value;
				elOption.textContent = oOption.label;
				if (String(oOption.value) === String(sSelectedValue)) elOption.selected = true;
				selectEl.appendChild(elOption);
			});
		}

		function readFileAsBase64(file) {
			return new Promise(function (resolve, reject) {
				var reader = new FileReader();
				reader.onload = function (e) {
					var sResult = String(e.target.result);
					var iIdx = sResult.indexOf("base64,");
					resolve(iIdx !== -1 ? sResult.substring(iIdx + 7) : sResult);
				};
				reader.onerror = function () {
					reject(new Error("Не удалось прочитать файл"));
				};
				reader.readAsDataURL(file);
			});
		}

		function addRowFiles(oRow, aFiles, onDone) {
			if (!oRow.files) oRow.files = [];
			var aReads = aFiles.map(function (file) {
				return readFileAsBase64(file).then(function (sBase64) {
					oRow.files.push({ name: file.name, base64: sBase64 });
				});
			});
			Promise.all(aReads)
				.then(function () {
					onDone();
				})
				.catch(function (err) {
					if (window.Snacks) window.Snacks.create({ type: "warning", title: "Не удалось прочитать файл: " + err.message, timeout: 5000 });
					onDone();
				});
		}

		// ---- Расходы ----

		function renderExpenses() {
			expensesBody.innerHTML = "";

			if (state.expenses.length === 0) {
				var elEmptyRow = document.createElement("tr");
				elEmptyRow.innerHTML = '<td colspan="8" class="report-empty">Расходы не заполнены</td>';
				expensesBody.appendChild(elEmptyRow);
				return;
			}

			state.expenses.forEach(function (oRow) {
				var bDaily = isCategoryDaily(oRow.category_id) || oRow.is_daily;
				var bLocked = bDaily || state.isSent;

				var tr = document.createElement("tr");
				if (bLocked) tr.className = "report-row_locked";

				var tdCategory = document.createElement("td");
				if (bLocked) {
					var elCategoryText = document.createElement("span");
					elCategoryText.className = "report-cell-text";
					elCategoryText.textContent = oRow.category_name;
					tdCategory.appendChild(elCategoryText);
				} else {
					var elCategorySelect = document.createElement("select");
					elCategorySelect.className = "report-select";
					fillSelectOptions(
						elCategorySelect,
						state.categories.map(function (c) {
							return { value: c.id, label: c.name };
						}),
						oRow.category_id,
						"Категория"
					);
					elCategorySelect.addEventListener("change", function () {
						oRow.category_id = elCategorySelect.value;
						var oCat = state.categories.filter(function (c) {
							return c.id === oRow.category_id;
						})[0];
						oRow.category_name = oCat ? oCat.name : "";
						renderExpenses();
					});
					tdCategory.appendChild(elCategorySelect);
				}
				tr.appendChild(tdCategory);

				// tr.appendChild(makeTextCell(oRow, "vendor", bLocked));

				var tdDocType = document.createElement("td");
				if (bLocked) {
					var elDocTypeText = document.createElement("span");
					elDocTypeText.className = "report-cell-text";
					elDocTypeText.textContent = oRow.incoming_doc_type_label || oRow.incoming_doc_type;
					tdDocType.appendChild(elDocTypeText);
				} else {
					var elDocTypeSelect = document.createElement("select");
					elDocTypeSelect.className = "report-select";
					fillSelectOptions(elDocTypeSelect, state.incomingDocTypes, oRow.incoming_doc_type, "Вид");
					elDocTypeSelect.addEventListener("change", function () {
						oRow.incoming_doc_type = elDocTypeSelect.value;
					});
					tdDocType.appendChild(elDocTypeSelect);
				}
				tr.appendChild(tdDocType);

				tr.appendChild(makeTextCell(oRow, "incoming_doc_number", bLocked));
				tr.appendChild(makeDateCell(oRow, "incoming_doc_date", bLocked));
				tr.appendChild(makeSumCell(oRow, bLocked));
				tr.appendChild(makeCurrencyCell(oRow, bLocked));

				tr.appendChild(makeFileCell(oRow, bLocked, renderExpenses));
				tr.appendChild(makeRemoveCell(state.expenses, oRow, bLocked, renderExpenses));

				expensesBody.appendChild(tr);
			});
		}

		// ---- Билеты ----

		function renderTickets() {
			ticketsBody.innerHTML = "";

			if (state.tickets.length === 0) {
				var elEmptyRow = document.createElement("tr");
				elEmptyRow.innerHTML = '<td colspan="5" class="report-empty">Билеты не заполнены</td>';
				ticketsBody.appendChild(elEmptyRow);
				return;
			}

			state.tickets.forEach(function (oRow) {
				var bLocked = oRow.is_from_1c || state.isSent;

				var tr = document.createElement("tr");
				if (bLocked) tr.className = "report-row_locked";

				var tdDocType = document.createElement("td");
				var elTicketName = document.createElement("span");
				elTicketName.className = "report-cell-text";
				elTicketName.textContent = oRow.name || "Билет";
				tdDocType.appendChild(elTicketName);
				tr.appendChild(tdDocType);

				// tr.appendChild(makeTextCell(oRow, "vendor", bLocked));

				// var tdCategory = document.createElement("td");
				// if (bLocked) {
				// 	var elCategoryText = document.createElement("span");
				// 	elCategoryText.className = "report-cell-text";
				// 	elCategoryText.textContent = oRow.category_name;
				// 	tdCategory.appendChild(elCategoryText);
				// } else {
				// 	var elCategorySelect = document.createElement("select");
				// 	elCategorySelect.className = "report-select";
				// 	fillSelectOptions(
				// 		elCategorySelect,
				// 		state.categories.map(function (c) {
				// 			return { value: c.id, label: c.name };
				// 		}),
				// 		oRow.category_id,
				// 		"Категория"
				// 	);
				// 	elCategorySelect.addEventListener("change", function () {
				// 		oRow.category_id = elCategorySelect.value;
				// 		var oCat = state.categories.filter(function (c) {
				// 			return c.id === oRow.category_id;
				// 		})[0];
				// 		oRow.category_name = oCat ? oCat.name : "";
				// 	});
				// 	tdCategory.appendChild(elCategorySelect);
				// }
				// tr.appendChild(tdCategory);

				// tr.appendChild(makeTextCell(oRow, "incoming_doc_number", bLocked));
				// tr.appendChild(makeDateCell(oRow, "incoming_doc_date", bLocked));
				tr.appendChild(makeSumCell(oRow, bLocked));

				var tdCurrency = document.createElement("td");
				tdCurrency.innerHTML = '<span class="report-cell-text">RUB</span>';
				tr.appendChild(tdCurrency);
				tr.appendChild(makeFileCell(oRow, state.isSent, renderTickets));
				tr.appendChild(makeRemoveCell(state.tickets, oRow, bLocked, renderTickets));

				ticketsBody.appendChild(tr);
			});
		}

		// ---- Общие ячейки ----

		function makeTextCell(oRow, sField, bLocked) {
			var td = document.createElement("td");
			if (bLocked) {
				var elText = document.createElement("span");
				elText.className = "report-cell-text";
				elText.textContent = oRow[sField] || "";
				td.appendChild(elText);
				return td;
			}
			var elInput = document.createElement("input");
			elInput.type = "text";
			elInput.className = "report-input report-input_compact";
			elInput.value = oRow[sField] || "";
			elInput.addEventListener("input", function () {
				oRow[sField] = elInput.value;
			});
			td.appendChild(elInput);
			return td;
		}

		function makeDateCell(oRow, sField, bLocked) {
			var td = document.createElement("td");
			if (bLocked) {
				var elText = document.createElement("span");
				elText.className = "report-cell-text";
				elText.textContent = oRow[sField] || "";
				td.appendChild(elText);
				return td;
			}
			var elInput = document.createElement("input");
			elInput.type = "date";
			elInput.className = "report-input";
			elInput.value = toIsoDate(oRow[sField]);
			elInput.addEventListener("change", function () {
				oRow[sField] = elInput.value;
			});
			td.appendChild(elInput);
			return td;
		}

		function toIsoDate(sDate) {
			if (!sDate) return "";
			var aParts = sDate.split(".");
			if (aParts.length === 3) return aParts[2] + "-" + aParts[1] + "-" + aParts[0];
			return sDate;
		}

		function makeSumCell(oRow, bLocked) {
			var td = document.createElement("td");
			if (bLocked) {
				var elText = document.createElement("span");
				elText.className = "report-cell-text report-cell-text_sum";
				elText.textContent = fmtNum(oRow.sum);
				td.appendChild(elText);
				return td;
			}
			var elInput = document.createElement("input");
			elInput.type = "number";
			elInput.step = "0.01";
			elInput.className = "report-input report-input_sum report-input_compact";
			elInput.value = oRow.sum || 0;
			elInput.addEventListener("input", function () {
				oRow.sum = parseFloat(elInput.value) || 0;
			});
			td.appendChild(elInput);
			return td;
		}

		function makeCurrencyCell(oRow, bLocked) {
			var td = document.createElement("td");
			if (bLocked) {
				var elText = document.createElement("span");
				elText.className = "report-cell-text";
				var oCur = state.currencies.filter(function (c) {
					return c.id === oRow.currency_id;
				})[0];
				elText.textContent = oCur ? oCur.name : "";
				td.appendChild(elText);
				return td;
			}
			var elSelect = document.createElement("select");
			elSelect.className = "report-select";
			fillSelectOptions(
				elSelect,
				state.currencies.map(function (c) {
					return { value: c.id, label: c.name };
				}),
				oRow.currency_id,
				"-"
			);
			elSelect.addEventListener("change", function () {
				oRow.currency_id = elSelect.value;
			});
			td.appendChild(elSelect);
			return td;
		}

		function makeFileCell(oRow, bFileLocked, onChanged) {
			var td = document.createElement("td");
			var aFiles = oRow.files || [];

			// В заблокированном виде без вложений — просто прочерк, кнопку не показываем.
			if (bFileLocked && aFiles.length === 0) {
				var elDash = document.createElement("span");
				elDash.className = "report-files-dash";
				elDash.textContent = "—";
				td.appendChild(elDash);
				return td;
			}

			var elBtn = document.createElement("button");
			elBtn.type = "button";
			elBtn.className = "report-files-btn";
			elBtn.textContent = aFiles.length > 0 ? "Файлы (" + aFiles.length + ")" : "Файлы";
			elBtn.addEventListener("click", function () {
				openFilesModal(oRow, bFileLocked, onChanged);
			});
			td.appendChild(elBtn);
			return td;
		}

		// ---- Модальное окно вложений строки ----

		var filesModalCtx = null;

		function openFilesModal(oRow, bFileLocked, onChanged) {
			if (!oRow.files) oRow.files = [];
			filesModalCtx = { row: oRow, locked: !!bFileLocked, onChanged: onChanged || function () {} };
			filesModalAddEl.classList.toggle("avans-hidden", !!bFileLocked);
			renderFilesModal();
			filesModalEl.classList.remove("avans-hidden");
		}

		function closeFilesModal() {
			filesModalEl.classList.add("avans-hidden");
			filesModalAddInputEl.value = "";
			filesModalCtx = null;
		}

		function renderFilesModal() {
			if (!filesModalCtx) return;
			var oRow = filesModalCtx.row;
			var bLocked = filesModalCtx.locked;
			var aFiles = oRow.files || [];

			filesModalListEl.innerHTML = "";
			filesModalEmptyEl.hidden = aFiles.length > 0;

			aFiles.forEach(function (oFile) {
				var elItem = document.createElement("li");
				elItem.className = "avans-files-item";

				if (oFile.id) {
					var elLink = document.createElement("a");
					elLink.className = "avans-files-name report-file-link";
					elLink.href = "/download_file.html?file_id=" + oFile.id;
					elLink.target = "_blank";
					elLink.textContent = oFile.name;
					elItem.appendChild(elLink);
				} else {
					var elName = document.createElement("span");
					elName.className = "avans-files-name";
					elName.textContent = oFile.name;
					elItem.appendChild(elName);

					var elPending = document.createElement("span");
					elPending.className = "avans-files-pending";
					elPending.textContent = "не сохранён";
					elItem.appendChild(elPending);
				}

				if (!bLocked) {
					var elRemove = document.createElement("button");
					elRemove.type = "button";
					elRemove.className = "avans-files-action avans-files-action_remove";
					elRemove.textContent = oFile.id ? "Удалить" : "Убрать";
					elRemove.addEventListener("click", function () {
						var iIdx = oRow.files.indexOf(oFile);
						if (iIdx !== -1) oRow.files.splice(iIdx, 1);
						renderFilesModal();
						filesModalCtx.onChanged();
					});
					elItem.appendChild(elRemove);
				}

				filesModalListEl.appendChild(elItem);
			});
		}

		filesModalAddInputEl.addEventListener("change", function () {
			if (!filesModalCtx) return;
			var oCtx = filesModalCtx;
			var aPicked = Array.prototype.slice.call(filesModalAddInputEl.files || []);
			filesModalAddInputEl.value = "";
			if (aPicked.length === 0) return;
			addRowFiles(oCtx.row, aPicked, function () {
				renderFilesModal();
				oCtx.onChanged();
			});
		});

		container.querySelector("#report-files-modal-close").addEventListener("click", closeFilesModal);
		container.querySelector("#report-files-modal-backdrop").addEventListener("click", closeFilesModal);
		container.querySelector("#report-files-modal-done").addEventListener("click", closeFilesModal);

		function makeRemoveCell(aList, oRow, bLocked, onChanged) {
			var td = document.createElement("td");
			if (bLocked) return td;

			var elBtn = document.createElement("button");
			elBtn.type = "button";
			elBtn.className = "report-remove-btn";
			elBtn.textContent = "Удалить";
			elBtn.addEventListener("click", function () {
				var iIdx = aList.indexOf(oRow);
				if (iIdx !== -1) aList.splice(iIdx, 1);
				onChanged();
			});
			td.appendChild(elBtn);
			return td;
		}

		function fmtNum(v) {
			if (v === undefined || v === null || v === "") return "";
			return Number(v).toLocaleString("ru-RU");
		}

		// ---- Добавление строк ----

		addExpenseBtn.addEventListener("click", function () {
			newRowCounter++;
			state.expenses.push({
				row_uid: "new_" + newRowCounter,
				category_id: undefined,
				category_name: "",
				vendor: "",
				incoming_doc_type: "",
				incoming_doc_number: "",
				incoming_doc_date: "",
				sum: 0,
				currency_id: undefined,
				is_from_1c: false,
				is_daily: false,
				files: [],
				origFileIds: []
			});
			renderExpenses();
		});

		// ---- Сохранение / отправка ----

		function addFilesToPayload(oPayload, oRow) {
			var aFiles = oRow.files || [];

			oPayload.new_files = aFiles
				.filter(function (oFile) {
					return !oFile.id;
				})
				.map(function (oFile) {
					return { name: oFile.name, data: oFile.base64 };
				});

			var aKeptIds = aFiles
				.filter(function (oFile) {
					return !!oFile.id;
				})
				.map(function (oFile) {
					return String(oFile.id);
				});
			oPayload.removed_file_ids = (oRow.origFileIds || []).filter(function (sId) {
				return aKeptIds.indexOf(sId) === -1;
			});
		}

		function buildExpensesPayload() {
			return state.expenses.map(function (oRow) {
				var oPayload = {
					row_uid: oRow.row_uid,
					category_id: oRow.category_id,
					vendor: oRow.vendor,
					incoming_doc_type: oRow.incoming_doc_type,
					incoming_doc_number: oRow.incoming_doc_number,
					incoming_doc_date: oRow.incoming_doc_date,
					sum: oRow.sum,
					currency_id: oRow.currency_id
				};
				addFilesToPayload(oPayload, oRow);
				return oPayload;
			});
		}

		function buildTicketsPayload() {
			return state.tickets.map(function (oRow) {
				var oPayload = {
					row_uid: oRow.row_uid,
					category_id: oRow.category_id,
					vendor: oRow.vendor,
					incoming_doc_number: oRow.incoming_doc_number,
					incoming_doc_date: oRow.incoming_doc_date,
					sum: oRow.sum
				};
				addFilesToPayload(oPayload, oRow);
				return oPayload;
			});
		}

		function validateBeforeSave() {
			var aInvalidExpense = state.expenses.filter(function (oRow) {
				if (oRow.is_from_1c || isCategoryDaily(oRow.category_id)) return false;
				return !oRow.category_id || !oRow.incoming_doc_type;
			});
			if (aInvalidExpense.length > 0) {
				showError("Заполните категорию и вид документа во всех строках расходов");
				return false;
			}
			var aMissingCurrency = state.expenses.filter(function (oRow) {
				if (oRow.is_from_1c || oRow.is_daily || isCategoryDaily(oRow.category_id)) return false;
				return !oRow.currency_id;
			});
			if (aMissingCurrency.length > 0) {
				showError("Заполните валюту во всех строках расходов");
				return false;
			}
			var aInvalidTicket = state.tickets.filter(function (oRow) {
				if (oRow.is_from_1c) return false;
				return !oRow.category_id;
			});
			if (aInvalidTicket.length > 0) {
				showError("Заполните категорию расходов во всех строках билетов");
				return false;
			}
			return true;
		}

		function setBusy(bBusy, elBtn, sBusyText, sOriginalText) {
			saveBtn.disabled = bBusy || state.isSent;
			submitBtn.disabled = bBusy || state.isSent;
			if (elBtn) elBtn.textContent = bBusy ? sBusyText : sOriginalText;
		}

		saveBtn.addEventListener("click", function () {
			clearError();
			if (!validateBeforeSave()) return;

			setBusy(true, saveBtn, "Сохранение...", "Сохранить");
			ExpenseReportApi.saveDraft({
				expenses_json: JSON.stringify(buildExpensesPayload()),
				tickets_json: JSON.stringify(buildTicketsPayload())
			})
				.then(function () {
					if (window.Snacks) window.Snacks.create({ type: "success", title: "Черновик авансового отчёта сохранён", timeout: 3000 });
					return loadData();
				})
				.catch(function (err) {
					showError(err.message);
				})
				.then(function () {
					setBusy(false, saveBtn, "Сохранение...", "Сохранить");
				});
		});

		submitBtn.addEventListener("click", function () {
			clearError();
			if (!validateBeforeSave()) return;

			setBusy(true, submitBtn, "Отправка...", "Отправить");
			ExpenseReportApi.send({
				expenses_json: JSON.stringify(buildExpensesPayload()),
				tickets_json: JSON.stringify(buildTicketsPayload())
			})
				.then(function () {
					if (window.Snacks && window.Snacks.createWithReload) {
						window.Snacks.createWithReload({ type: "success", title: "Авансовый отчёт отправлен", timeout: 5000 });
					} else {
						location.reload();
					}
				})
				.catch(function (err) {
					showError(err.message);
					setBusy(false, submitBtn, "Отправка...", "Отправить");
				});
		});

		// ---- Загрузка данных ----

		function loadData() {
			return ExpenseReportApi.getData().then(function (data) {
				state.isSent = !!data.is_sent;
				state.categories = data.categories || [];
				state.currencies = data.currencies || [];
				state.incomingDocTypes = data.incoming_doc_types || [];
				state.expenses = (data.expenses || []).map(stampOrigFiles);
				state.tickets = (data.tickets || []).map(stampOrigFiles);

				renderExpenses();
				renderTickets();

				saveBtn.disabled = state.isSent;
				submitBtn.disabled = state.isSent;
				submitBtn.textContent = state.isSent ? "Отправлено" : "Отправить";
				addExpenseBtn.classList.toggle("avans-hidden", state.isSent);

				loadingEl.classList.add("avans-hidden");
				formEl.classList.remove("avans-hidden");
			});
		}

		if (!iBusinessTripID) {
			loadingEl.classList.add("avans-hidden");
			deniedEl.textContent = "Не удалось определить командировку для этой страницы";
			deniedEl.classList.remove("avans-hidden");
		} else {
			loadData().catch(function (err) {
				loadingEl.classList.add("avans-hidden");
				deniedEl.textContent = err.message || "Не удалось загрузить авансовый отчёт";
				deniedEl.classList.remove("avans-hidden");
			});
		}
	})();
</script>
